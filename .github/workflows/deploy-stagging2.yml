name: Deploy custom WordPress code to staging2

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: ez-itin-staging2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to existing staging only
    runs-on: ubuntu-latest
    steps:
      - name: Check out managed code
        uses: actions/checkout@v4

      - name: Validate managed theme before deployment
        run: |
          set -euo pipefail
          THEME="wp-content/themes/ez-itin-block-theme"
          test -s "$THEME/functions.php"
          test -s "$THEME/theme.json"
          test -s "$THEME/templates/front-page.html"
          test -s "$THEME/assets/css/design-system.css"
          find "$THEME" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          test "$(grep -o '<h1' "$THEME/templates/front-page.html" | wc -l)" -eq 1
          grep -Fq 'ITIN Application Assistance' "$THEME/templates/front-page.html"
          grep -Fq 'Certifying Acceptance Agent' "$THEME/templates/front-page.html"

      - name: Load encrypted SiteGround SSH key into agent
        env:
          SITEGROUND_SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SITEGROUND_SSH_KEY_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          KEY_FILE="$RUNNER_TEMP/ezitin-sg-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s\n' "$SITEGROUND_SSH_KEY" > "$KEY_FILE"
          ssh-keygen -p -P "$SITEGROUND_SSH_KEY_PASSPHRASE" -N "" -f "$KEY_FILE"
          ssh-add "$KEY_FILE"
          rm -f "$KEY_FILE"
          unset SITEGROUND_SSH_KEY SITEGROUND_SSH_KEY_PASSPHRASE

      - name: Trust SiteGround host
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$SITEGROUND_PORT" "$SITEGROUND_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate exact staging target
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
          SITEGROUND_STAGING_PATH: ${{ secrets.SITEGROUND_STAGING_PATH }}
        run: |
          set -euo pipefail
          TARGET="${SITEGROUND_STAGING_PATH%/}"
          test "$TARGET" = "/home/customer/www/staging2.ez-itin.com/public_html"
          case "$TARGET" in
            "/home/customer/www/staging2.ez-itin.com/public_html") ;;
            *) echo "Refusing unexpected deployment target"; exit 1 ;;
          esac
          ssh -p "$SITEGROUND_PORT" -o BatchMode=yes "$SITEGROUND_USER@$SITEGROUND_HOST" \
            "test -d '$TARGET/wp-content/themes' && test -d '$TARGET/wp-content/plugins'"

      - name: Deploy managed themes and plugins without deleting server files
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
          SITEGROUND_STAGING_PATH: ${{ secrets.SITEGROUND_STAGING_PATH }}
        run: |
          set -euo pipefail
          TARGET="${SITEGROUND_STAGING_PATH%/}"
          RSYNC_SSH="ssh -p $SITEGROUND_PORT -o BatchMode=yes"
          for component in themes plugins; do
            if [ -d "wp-content/$component" ]; then
              rsync -az --human-readable --itemize-changes \
                --exclude='uploads/' --exclude='cache/' --exclude='upgrade/' \
                -e "$RSYNC_SSH" \
                "wp-content/$component/" \
                "$SITEGROUND_USER@$SITEGROUND_HOST:$TARGET/wp-content/$component/"
            fi
          done

      - name: Verify staging WordPress after deployment
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
          SITEGROUND_PORT: ${{ secrets.SITEGROUND_PORT }}
          SITEGROUND_STAGING_PATH: ${{ secrets.SITEGROUND_STAGING_PATH }}
        run: |
          set -euo pipefail
          TARGET="${SITEGROUND_STAGING_PATH%/}"
          ssh -p "$SITEGROUND_PORT" -o BatchMode=yes "$SITEGROUND_USER@$SITEGROUND_HOST" \
            "cd '$TARGET' && wp --info && wp core version && wp option get home && wp option get siteurl && wp theme list && wp plugin list && wp cache flush && (wp sg purge >/dev/null 2>&1 || true)"

      - name: Verify staging homepage SEO markers
        run: |
          set -euo pipefail
          PAGE_HTML="$(curl --fail --silent --show-error --location --max-time 30 'https://staging2.ez-itin.com/')"
          printf '%s' "$PAGE_HTML" | grep -Fq 'ITIN Application Assistance'
          printf '%s' "$PAGE_HTML" | grep -Fq 'Certifying Acceptance Agent'
          printf '%s' "$PAGE_HTML" | grep -Fq 'application/ld+json'
